name: CI

# Los PRs no validaban nada: el unico workflow desplegaba la demo en `push` a dev,
# sin correr tests. Esto corre la suite ANTES de mergear.
on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la ejecucion anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Cubre tambien la generacion de tipos (.d.ts) y el bundle aparte de React Native.
      - name: Build
        run: npm run build

      # El runner parte de un clon limpio: es justo el caso en el que la ruta del CSS
      # se movia sola. Aqui es donde se detecta, no en el movil de un cliente.
      - name: Check package layout
        run: npm run check:layout

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Retry the system deps; if the Ubuntu mirror is down, Chromium alone (ubuntu-24.04 has its deps).
      - name: Install Playwright browser
        run: |
          for i in 1 2; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps failed (try $i)"; sleep 20
          done
          echo "::warning::system deps unavailable; installing Chromium without them"
          npx playwright install chromium

      # Los fixtures de e2e cargan `../dist`: sin build no hay nada que probar.
      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
