name: CI

# Los PRs no validaban nada: el unico workflow desplegaba la demo en `push` a dev,
# sin correr tests. Esto corre la suite ANTES de mergear.
on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la ejecucion anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Cubre tambien la generacion de tipos (.d.ts) y el bundle aparte de React Native.
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Los fixtures de e2e cargan `../dist`: sin build no hay nada que probar.
      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
