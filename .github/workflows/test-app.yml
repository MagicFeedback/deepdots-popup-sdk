name: Test app

# Test app de MF-3243 (apps/test-app): una tienda de prueba que carga el SDK PUBLICADO en npm
# (o la build de este commit) contra DEV, y una suite de Playwright encima: el smoke (MF-3243) y
# la regresión funcional (MF-3245, e2e/regression, escritorio + móvil). Un job por versión:
#
#   local   la build de este commit (lo que se va a publicar)
#   latest  la `latest` de npm (lo que tienen hoy los clientes)
#   1.16.1  la versión anterior soportada
#
# A mano (Run workflow) se puede pasar cualquier lista de versiones, p. ej. "1.14.0 1.17.1".
# Los lunes corre solo con una lista más amplia de versiones publicadas.
# Todo va contra api-dev.deepdots.com con la compañía MAGICFEEDBACK_DEV; la app bloquea
# cualquier petición a producción y la suite falla si alguna sale.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/test-app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-app.yml'
  push:
    branches: [dev]
  schedule:
    - cron: '0 6 * * 1'
  # release.yml calls it after every release (DD-25): validation report on GitHub Pages + Slack.
  workflow_call:
    inputs:
      versions:
        type: string
        required: true
      report:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
      notify:
        type: boolean
        default: false
    secrets:
      SDK_RELEASES_SLACK_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      versions:
        description: 'SDK versions separated by spaces (local, latest, X.Y.Z)'
        required: false
        default: 'local latest 1.16.1'
      record:
        description: 'Record a video of every test'
        type: boolean
        default: false
      report:
        description: 'Release validation report for the FIRST version of the list'
        type: boolean
        default: false
      publish:
        description: 'Publish the report on GitHub Pages (validation/<version>/)'
        type: boolean
        default: false
      notify:
        description: 'Post the validation result to Slack (marked TEST unless called by a release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - id: pick
        env:
          INPUT: ${{ inputs.versions }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          default="local latest 1.16.1"
          [ "$SCHEDULED" = "true" ] && default="local latest 1.16.1 1.15.0"
          list="${INPUT:-$default}"
          json=$(printf '%s\n' $list | jq -R . | jq -cs .)
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "SDK versions: $list"

  smoke:
    name: Smoke + regression · SDK ${{ matrix.sdk }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Solo hace falta para ?sdk=local; el resto carga el paquete publicado desde jsDelivr.
      - name: Build SDK
        if: matrix.sdk == 'local'
        run: npm run build

      - name: Resolve SDK version
        id: version
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          case "$SDK" in
            local) v="$(node -p "require('./package.json').version")-local" ;;
            [0-9]*) v="$SDK" ;;
            *) v="$(npm view @magicfeedback/popup-sdk@"$SDK" version)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "### SDK under test: \`$v\` (\`$SDK\`) · env DEV (api-dev.deepdots.com)" >> "$GITHUB_STEP_SUMMARY"
          echo "SDK under test: $v ($SDK) · env DEV"

      - name: Run smoke + regression
        working-directory: apps/test-app
        env:
          SDK_VERSION: ${{ matrix.sdk }}
          RECORD_VIDEO: ${{ inputs.record && '1' || '' }}
        run: npx playwright test -c playwright.config.ts

      - name: Summary
        if: always()
        working-directory: apps/test-app
        run: |
          node -e '
            const r = require("./test-results/results.json");
            const s = r.stats;
            const rows = {};
            const known = new Set();
            const walk = (suite) => {
              (suite.suites || []).forEach(walk);
              for (const spec of suite.specs || []) {
                for (const t of spec.tests) {
                  const row = (rows[t.projectName] ??= { passed: 0, failed: 0, knownBug: 0, skipped: 0 });
                  if (t.status === "skipped") row.skipped++;
                  else if (t.status !== "expected") row.failed++;
                  else if (t.expectedStatus === "failed") row.knownBug++;
                  else row.passed++;
                  for (const a of t.annotations || []) if (a.type === "known-bug") known.add(a.description.replace(/ \(.*$/, ""));
                }
              }
            };
            r.suites.forEach(walk);
            console.log(`expected ${s.expected} · unexpected ${s.unexpected} · flaky ${s.flaky} · skipped ${s.skipped}\n`);
            console.log("| project (platform · SDK) | passed | known bug (test.fail) | failed | skipped |");
            console.log("|---|---|---|---|---|");
            for (const [p, x] of Object.entries(rows)) console.log(`| ${p} | ${x.passed} | ${x.knownBug} | ${x.failed} | ${x.skipped} |`);
            if (known.size) console.log("\nKnown SDK bugs detected:\n" + [...known].map((k) => `- ${k}`).join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-app-report-${{ matrix.sdk }}
          path: |
            apps/test-app/playwright-report/
            apps/test-app/test-results/
          retention-days: 14

  # Release validation report (DD-25): generated only from the Playwright results of the first
  # version of the list and the job result. Same script as the native SDK (scripts/release).
  report:
    name: Validation report
    needs: [matrix, smoke]
    if: always() && (inputs.report || inputs.publish) && needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # validation-reports branch (publish)
      actions: write # demo-gh-pages.yml (publish)
    env:
      VERSIONS: ${{ needs.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Version under test
        id: v
        run: |
          set -euo pipefail
          FIRST=$(jq -r '.[0]' <<< "$VERSIONS")
          case "$FIRST" in
            local) V="$(node -p "require('./package.json').version")-local" ;;
            *) V="$(npm view @magicfeedback/popup-sdk@"$FIRST" version)" ;;
          esac
          echo "first=$FIRST" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The job result only speaks for this version when it is the only one in the run.
          if [ "$(jq length <<< "$VERSIONS")" = 1 ]; then echo "jobs=web=${{ needs.smoke.result }}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          name: test-app-report-${{ steps.v.outputs.first }}
          path: pw
      - name: Validation report
        id: report
        env:
          SDK: ${{ steps.v.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          OUT="validation/$SDK"
          node scripts/release/playwright-results.mjs pw/test-results/results.json > results.json
          node scripts/release/validation-report.mjs --results results.json --version "$SDK" --out "$OUT" \
            --jobs "${{ steps.v.outputs.jobs }}" --changelog CHANGELOG.md --run-url "$RUN_URL"
          PDF="Deepdots-Popup-SDK-Web-$SDK-Release-Validation-Report.pdf"
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="$PWD/$OUT/$PDF" "file://$PWD/$OUT/report.html"
          test -s "$OUT/$PDF"
          cp results.json "$OUT/"
          echo "## Validation report $SDK: $(jq -r .status "$OUT/summary.json")" >> "$GITHUB_STEP_SUMMARY"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ steps.v.outputs.version }}
          path: validation/
          retention-days: 90
      # Kept in the validation-reports branch (one folder per version, the last attempt wins);
      # demo-gh-pages.yml serves it under /validation/.
      # A cancelled run (stopped by hand) neither publishes nor notifies: its report is partial.
      - name: Publish the report on GitHub Pages
        if: ${{ !cancelled() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          SDK: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin validation-reports; then
            git worktree add pages FETCH_HEAD
          else
            git worktree add --detach pages && git -C pages checkout --orphan validation-reports && git -C pages rm -rfq .
          fi
          rm -rf "pages/$SDK" && cp -R "validation/$SDK" "pages/$SDK"
          node scripts/release/validation-report.mjs index pages
          git -C pages add -A
          git -C pages commit -qm "validation report $SDK (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})"
          git -C pages push origin HEAD:refs/heads/validation-reports
          gh workflow run demo-gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref dev
      # Without notify/publish the message is only printed in the log.
      - name: Slack
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SDK_RELEASES_SLACK_WEBHOOK_URL }}
          SDK: ${{ steps.v.outputs.version }}
          PAGES: https://magicfeedback.github.io/deepdots-popup-sdk/validation/${{ steps.v.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LINKS=(--link "Test run=$RUN_URL")
          if [ "${{ inputs.publish }}" = true ]; then
            LINKS=(--link "Report=$PAGES/report.html" --link "PDF=$PAGES/${{ steps.report.outputs.pdf }}" "${LINKS[@]}")
          else
            LINKS=(--link "Report (artifact)=$RUN_URL#artifacts" "${LINKS[@]}")
          fi
          FLAGS=()
          # Only a release (push of the tag) sends the real notice; anything else is marked TEST.
          [ "${{ github.event_name }}" = push ] || FLAGS+=(--test)
          [ "${{ inputs.notify || inputs.publish }}" = true ] || FLAGS+=(--print)
          node scripts/release/validation-report.mjs slack --summary "validation/$SDK/summary.json" "${LINKS[@]}" "${FLAGS[@]}"
