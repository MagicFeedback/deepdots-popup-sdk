name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Assemble demo site
        run: bash ./scripts/build-demo-site.sh

      # Release validation reports (DD-25): the validation-reports branch, one folder per version,
      # written by test-app.yml. Served under /validation/.
      - name: Add release validation reports
        run: |
          if git fetch --depth=1 origin validation-reports; then
            mkdir -p .demo-site/validation
            git archive FETCH_HEAD | tar -x -C .demo-site/validation
          else
            echo "No validation-reports branch yet"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .demo-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
