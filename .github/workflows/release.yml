name: Release

# Publica en npm al subir un tag `vX.Y.Z`. Sustituye al `npm run release` desde el portatil
# (que dependia de un NPM_TOKEN en `.npm.env` y de la linea de auth del `~/.npmrc`).
#
# Flujo de release (docs/VERSIONING.md):
#   1. `npm run release:prepare -- patch|minor|major`: PR a dev con la version, la seccion
#      `## [X.Y.Z]` del CHANGELOG y release/compatibility.json. Su "Release dry run" corre este
#      mismo gate y prueba el tarball antes de que exista el tag.
#   2. Fusionada la PR: `npm run release:tag` (sube el tag vX.Y.Z).
#
# Antes de publicar, el gate (scripts/release/check.mjs release) bloquea si falta el bump, las
# release notes o el manifiesto de compatibilidad es invalido. El tarball se empaqueta una vez,
# se prueba y se publica ESE fichero; la GitHub Release lleva el tarball, SHA256SUMS,
# release.json (commit, hashes, CI, aprobacion) y el manifiesto.
#
# Autenticacion: npm Trusted Publishing (OIDC), sin token guardado. Se configura UNA vez en
# npmjs.com > @magicfeedback/popup-sdk > Settings > Trusted publisher:
#   GitHub Actions · MagicFeedback / deepdots-popup-sdk · workflow `release.yml`.
# La provenance se genera sola al publicar desde aqui.
#
# Al final fusiona el commit del tag en `main`; si da conflicto, abre una PR para resolverlo.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # crear la GitHub Release
  id-token: write # OIDC para npm Trusted Publishing
  pull-requests: write # PR de respaldo si el merge en main da conflicto
  actions: read # metadata.mjs lee el CI del commit etiquetado

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      # Trusted Publishing necesita npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      # Gate de release (MF-3241, docs/VERSIONING.md). Si falla, no se publica nada:
      # tag = version, bump respecto a lo publicado en su linea, notas en el CHANGELOG y
      # manifiesto de compatibilidad valido (schema, version, renderer, config schema, fixtures).
      - name: Release gate
        id: meta
        run: |
          set -euo pipefail
          # Se releasea desde dev: un tag sobre un commit que no esta en dev es un error.
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::El commit del tag $GITHUB_REF_NAME no esta en origin/dev."
            exit 1
          fi
          node scripts/release/check.mjs release --tag "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package layout
        run: npm run check:layout

      # El artefacto se empaqueta UNA vez. Ese .tgz es el que se prueba, el que se publica
      # (npm publish <tgz> no reconstruye: no corre prepublishOnly) y el que se adjunta a la Release.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          npm pack --json --pack-destination "$RUNNER_TEMP/out" > "$RUNNER_TEMP/pack.json"
          echo "tgz=$RUNNER_TEMP/out/$(node -p "require('$RUNNER_TEMP/pack.json')[0].filename")" >> "$GITHUB_OUTPUT"
          echo "integrity=$(node -p "require('$RUNNER_TEMP/pack.json')[0].integrity")" >> "$GITHUB_OUTPUT"

      - name: Smoke test the tarball
        run: node scripts/release/smoke.mjs "${{ steps.pack.outputs.tgz }}"

      # Re-ejecutar el workflow no debe fallar si npm ya tiene la version.
      - name: Check if already published
        id: published
        run: |
          if npm view "@magicfeedback/popup-sdk@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@magicfeedback/popup-sdk@${{ steps.meta.outputs.version }} ya esta en npm; no se republica."
            NPM_INTEGRITY="$(npm view "@magicfeedback/popup-sdk@${{ steps.meta.outputs.version }}" dist.integrity)"
            if [ "$NPM_INTEGRITY" != "${{ steps.pack.outputs.integrity }}" ]; then
              echo "::warning::El tarball de esta ejecucion no es el publicado ($NPM_INTEGRITY). La metadata describe este; el bueno es el de npm."
            fi
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: |
          set -euo pipefail
          npm publish "${{ steps.pack.outputs.tgz }}" --access public --tag "${{ steps.meta.outputs.dist_tag }}" --json > "$RUNNER_TEMP/publish.json"
          cat "$RUNNER_TEMP/publish.json"

      # release.json: commit, sha256 + integrity del tarball (contrastada con lo que guardo npm),
      # CI del commit (tiene que estar en verde), PR de release con sus aprobaciones y quien etiqueto.
      - name: Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PUBLISH=()
          if [ -f "$RUNNER_TEMP/publish.json" ]; then PUBLISH=(--publish "$RUNNER_TEMP/publish.json"); fi
          node scripts/release/metadata.mjs --require-ci --tag "$GITHUB_REF_NAME" \
            --tgz "${{ steps.pack.outputs.tgz }}" --pack "$RUNNER_TEMP/pack.json" "${PUBLISH[@]}" \
            --out "$RUNNER_TEMP/out/release.json"
          cp release/compatibility.json release/config.schema.json "$RUNNER_TEMP/out/"
          (cd "$RUNNER_TEMP/out" && sha256sum -- *.tgz > SHA256SUMS && cat SHA256SUMS)

      # La Release se crea de una vez con sus ficheros: con releases inmutables no se pueden
      # anadir despues.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La GitHub Release $GITHUB_REF_NAME ya existe."
            exit 0
          fi
          FLAGS=()
          if [ "${{ steps.meta.outputs.dist_tag }}" = "next" ]; then FLAGS+=(--prerelease); fi
          if [ "${{ steps.meta.outputs.dist_tag }}" != "latest" ]; then FLAGS+=(--latest=false); fi
          OUT="$RUNNER_TEMP/out"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${FLAGS[@]}" \
            "${{ steps.pack.outputs.tgz }}" "$OUT/SHA256SUMS" "$OUT/release.json" \
            "$OUT/compatibility.json" "$OUT/config.schema.json"
          echo "Publicada [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # Politica: tras cada release, `main` recibe lo publicado. Se fusiona el commit del TAG
      # (no la punta de dev, que puede ir por delante). Si hay conflicto, no se fuerza nada:
      # se abre una PR para resolverlo a mano.
      - name: Merge release into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git checkout -f -B main origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::notice::main ya contiene $GITHUB_REF_NAME."
            exit 0
          fi
          if git merge --no-ff "$GITHUB_SHA" -m "merge: release $GITHUB_REF_NAME de dev a main"; then
            git push origin main
            echo "::notice::$GITHUB_REF_NAME fusionada en main."
          else
            git merge --abort
            BRANCH="release-to-main/$GITHUB_REF_NAME"
            git push -f origin "$GITHUB_SHA:refs/heads/$BRANCH"
            # Abrir la PR exige "Allow GitHub Actions to create and approve pull requests" en
            # Settings > Actions > General. Sin esa opcion, la rama queda subida y se avisa.
            if gh pr create --base main --head "$BRANCH" \
              --title "Release $GITHUB_REF_NAME: dev a main" \
              --body "El merge automatico de $GITHUB_REF_NAME en main ha dado conflicto. Resuelvelo en esta PR."; then
              echo "::warning::Conflicto al fusionar $GITHUB_REF_NAME en main: abierta una PR para resolverlo."
            else
              echo "::error::Conflicto al fusionar $GITHUB_REF_NAME en main. Abre a mano una PR de $BRANCH a main."
              exit 1
            fi
          fi
